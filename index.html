<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Datos VR - Adler</title>
  
  <!-- A-Frame Library -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style.css">
  
  <script>
    // Componente personalizado para interacción con los racks y servidores
    AFRAME.registerComponent('info-rack', {
      schema: {
        nombre: { type: 'string', default: 'Servidor / Rack' },
        estado: { type: 'string', default: 'Operativo' },
        temp: { type: 'string', default: '21°C' }
      },
      init: function () {
        var el = this.el;
        var data = this.data;
        
        el.addEventListener('click', function () {
          var panelNombre = document.getElementById('info-nombre');
          var panelEstado = document.getElementById('info-estado');
          var panelTemp = document.getElementById('info-temp');
          var hudPanel = document.getElementById('hud-info');
          
          if(panelNombre && panelEstado && panelTemp) {
            panelNombre.innerText = data.nombre;
            panelEstado.innerText = "Estado: " + data.estado;
            panelTemp.innerText = "Temperatura: " + data.temp;
            if(hudPanel) hudPanel.style.display = 'block';
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- HUD / Interfaz 2D superior con los datos de Adler -->
  <div id="ui-container">
    <div class="header-panel">
      <h1>SIMULADOR CENTRO DE DATOS VR</h1>
      <p>Administrador del Sistema: <strong>Adler</strong></p>
    </div>

    <!-- Panel Informativo de Inspección -->
    <div id="hud-info" class="info-card" style="display: none;">
      <h3 id="info-nombre">Rack Servidor</h3>
      <p id="info-estado">Estado: Normal</p>
      <p id="info-temp">Temperatura: --°C</p>
      <button onclick="document.getElementById('hud-info').style.display='none'">Cerrar</button>
    </div>
  </div>

  <!-- Escena A-Frame (3D) -->
  <a-scene embedded vr-mode-ui="enabled: true">
    
    <!-- Carga de Recursos / Modelos GLB de Adler -->
    <a-assets>
      <a-asset-item id="rack-glb" src="models/rack.glb"></a-asset-item>
      <a-asset-item id="router-glb" src="models/router.glb"></a-asset-item>
      <a-asset-item id="escritorio-glb" src="models/escritorio.glb"></a-asset-item>
      <a-asset-item id="servidores-glb" src="models/server_racking_system.glb"></a-asset-item>
      <a-asset-item id="rejilla-glb" src="models/rejilla.glb"></a-asset-item>
      <a-asset-item id="aire-glb" src="models/aire.glb"></a-asset-item>
    </a-assets>

    <!-- Cámara y Cursor para interactuar mediante clics -->
    <a-entity id="camera-rig" position="0 1.6 3">
      <a-camera look-controls wasd-controls>
        <a-cursor 
          id="cursor"
          raycaster="objects: .collidable"
          material="color: #ff0000; shader: flat"
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02">
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- Luces de la Sala -->
    <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light type="directional" position="-1 4 1" intensity="0.8"></a-light>

    <!-- PISO Y REJILLAS DE CABLEADO ESTRUCTURADO -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="12" height="12" color="#1a1a1a"></a-plane>
    <a-gltf-model src="#rejilla-glb" position="0 0.01 0" scale="1 1 1"></a-gltf-model>

    <!-- ENTIDADES DE MODELOS 3D (INFRAESTRUCTURA) -->
    
    <!-- Servidores / Racks de Producción -->
    <a-gltf-model 
      class="collidable"
      src="#servidores-glb" 
      position="-2 0 -2" 
      rotation="0 0 0" 
      scale="1 1 1"
      info-rack="nombre: Rack Principal de Servidores; estado: Activo; temp: 19°C">
    </a-gltf-model>

    <a-gltf-model 
      class="collidable"
      src="#rack-glb" 
      position="0 0 -2" 
      rotation="0 0 0" 
      scale="1 1 1"
      info-rack="nombre: Rack Secundario Storage; estado: Activo; temp: 22°C">
    </a-gltf-model>

    <!-- Enrutadores / Redes -->
    <a-gltf-model 
      class="collidable"
      src="#router-glb" 
      position="2 0 -2" 
      rotation="0 0 0" 
      scale="1 1 1"
      info-rack="nombre: Router Gateway Core; estado: Online; temp: 24°C">
    </a-gltf-model>

    <!-- Sistema de Climatización (Aire Acondicionado) -->
    <a-gltf-model 
      src="#aire-glb" 
      position="-4 0 -1" 
      rotation="0 90 0" 
      scale="1 1 1">
    </a-gltf-model>

    <!-- Escritorio de Monitoreo -->
    <a-gltf-model 
      src="#escritorio-glb" 
      position="0 0 1" 
      rotation="0 180 0" 
      scale="1 1 1">
    </a-gltf-model>

    <!-- Cielo / Entorno -->
    <a-sky color="#0a0e17"></a-sky>

  </a-scene>

</body>
</html>
